name: Check Markdown Links

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".lychee/**"
      - ".lycheeignore"
      - ".github/workflows/link-check.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".lychee/**"
      - ".lycheeignore"
      - ".github/workflows/link-check.yml"
  schedule:
    # Mondays at 07:17 America/Phoenix (14:17 UTC).
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  internal-links:
    name: Internal Markdown links
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check relative files and anchors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config .lychee/internal.toml
            './**/*.md'
          fail: true
          failIfEmpty: true
          format: markdown
          jobSummary: true
          output: lychee/internal.md

  external-links:
    name: External Markdown links
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check external HTTP(S) links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config .lychee/external.toml
            './**/*.md'
          fail: true
          failIfEmpty: true
          format: markdown
          jobSummary: true
          output: lychee/external.md
          token: ${{ github.token }}
